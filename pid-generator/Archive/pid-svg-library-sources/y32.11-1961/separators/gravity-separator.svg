<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" version="1.1">
  <metadata>
    <symbol>
      <id>gravity_separator</id>
      <category>separator</category>
      <description>Vertical gravity separator</description>
      <standard>original-standards-inspired</standard>
      <version>1.0.0</version>
      <connections>
        <connection id="inlet" x="10" y="40" type="pipe"/>
        <connection id="gas_out" x="50" y="10" type="pipe"/>
        <connection id="liquid_out" x="50" y="90" type="pipe"/>
      </connections>
    </symbol>
  </metadata>
  <defs>
    <style type="text/css">
    .sym-stroke { stroke: #1a1a1a; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .sym-fill { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.5; }
    </style>
  </defs>
  <g id="gravity-separator">
    <rect x="30" y="20" width="40" height="60" class="sym-fill"/>
    <line x1="10" y1="40" x2="30" y2="40" class="sym-stroke sym-thick"/>
    <line x1="50" y1="20" x2="50" y2="10" class="sym-stroke sym-thick"/>
    <line x1="50" y1="80" x2="50" y2="90" class="sym-stroke sym-thick"/>
    <line x1="35" y1="60" x2="65" y2="60" class="sym-stroke sym-dashed"/>
  </g>
</svg>
