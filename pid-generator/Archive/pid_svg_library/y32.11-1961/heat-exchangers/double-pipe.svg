    <line x1="20" y1="35" x2="20" y2="65" class="sym-stroke sym-thick"/>
    <line x1="80" y1="35" x2="80" y2="65" class="sym-stroke sym-thick"/>
    <line x1="10" y1="40" x2="20" y2="40" class="sym-stroke sym-thick"/>
    <line x1="80" y1="40" x2="90" y2="40" class="sym-stroke sym-thick"/>
    <line x1="10" y1="60" x2="20" y2="60" class="sym-stroke sym-thick"/>
    <line x1="80" y1="60" x2="90" y2="60" class="sym-stroke sym-thick"/>
