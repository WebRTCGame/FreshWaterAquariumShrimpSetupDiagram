<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" version="1.1">
  <metadata>
    <symbol>
      <id>knockout_drum</id>
      <category>vessel</category>
      <description>Knockout drum with mist extractor</description>
      <standard>original-standards-inspired</standard>
      <version>1.0.0</version>
      <connections>
        <connection id="inlet" x="10" y="40" type="nozzle"/>
        <connection id="gas_out" x="90" y="30" type="nozzle"/>
