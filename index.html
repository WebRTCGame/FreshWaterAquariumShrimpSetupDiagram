<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshwater Aquarium Shrimp Setup Diagram</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="sidebar">
      <div id="sidebar-header">
        Component Navigator
        <div style="font-size: 11px; font-weight: normal; margin-top: 6px; padding-top: 6px; border-top: 1px solid #495057; color: #e9ecef;">
          <div style="margin-bottom: 6px;">💡 <strong>Hover / Tap</strong> diagram components for quick info</div>
          <div style="margin-bottom: 8px;">🖱️ <strong>Click / Tap</strong> sidebar items to focus &amp; zoom</div>
          <div style="margin-bottom: 8px;">🤏 <strong>Pinch</strong> to zoom the diagram</div>
        </div>
        <div style="font-size: 12px; font-weight: normal; margin-top: 8px; padding-top: 8px; border-top: 1px solid #495057;">
          <div style="color: #28a745;">💡 Total System Operating Cost:</div>
          <div id="total-cost-monthly" style="color: #ffc107; font-weight: bold;">Monthly: computing...</div>
          <div id="total-cost-yearly" style="color: #ffc107; font-weight: bold;">Yearly: computing...</div>
          <div style="font-size: 10px; color: #adb5bd; margin-top: 4px;">Based on $0.14/kWh electricity rate</div>
        </div>
      </div>
      <div id="component-list">
        <!-- Components will be populated by JavaScript -->
      </div>
    </div>

    <!-- Overlay that closes the mobile sidebar when tapped -->
    <div id="sidebar-overlay"></div>

    <div id="main-container">
      <button id="toggle-sidebar">☰ Toggle Sidebar</button>
      <div id="graphDiv"></div>
      <!-- Tooltip element -->
      <div id="component-tooltip" class="component-tooltip"></div>
    </div>
    <script src="lib/mermaid.min.js"></script>
    <script src="lib/svg-pan-zoom.min.js"></script>
    <script src="components/data.js"></script>
    <script src="diagram.js"></script>
    <script src="sidebar.js"></script>
    <script src="tooltips.js"></script>
    <script src="app.js"></script>
  </body>
</html>
