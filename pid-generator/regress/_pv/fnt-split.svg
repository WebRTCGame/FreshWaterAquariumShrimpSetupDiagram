svg[data-theme]{background:#ffffff}
/* --- all annotation type is uppercase ---
   Applied as a PRESENTATION rule rather than by uppercasing the data. The DSL keeps
   its authored case, so toSource() still round-trips what the user typed, the
   validator still matches the original strings, and nothing that compares text
   (tag lookup, collision keys, the DSL textarea) is affected. Only what is drawn
   changes. */
svg[data-theme] text{text-transform:uppercase}
/* --- layers: entity groups; glyph strokes are currentColor and inherit --- */
.ly-equipment{color:#000000}
.ly-valve{color:#000000}
.ly-instrument{color:#000000}
.ly-nozzle{color:#000000}
.ly-junction{color:#000000}
/* --- lines --- */
.pid-line.pid-process{stroke:#1a1a1a;fill:none}
.pid-line.pid-signal{stroke:#1a1a1a;fill:none}
.pid-line.pid-tap{stroke:#1a1a1a;fill:none}
.pid-tap-leader{stroke:#1a1a1a}
circle.pid-junction-dot{fill:#000000;stroke:none}
.pid-nozzle-leader{stroke:#000000;fill:none}
/* --- text, by the role each literal already encoded --- */
text[fill="#111"]{fill:#111111}
text[fill="#666"],text[fill="#555"],text[fill="#444"]{fill:#555555}
text[fill="#888"]{fill:#888888}
text[fill="#0D47A1"]{fill:#0d47a1}
text[fill="#333"]{fill:#333333}
/* --- the halo: MUST follow the background, or labels glow on black --- */
[stroke="white"]{stroke:#ffffff}
[stroke="black"]{stroke:#000000}
rect[stroke="#333"]{stroke:#333333}
rect[fill="white"]{fill:#ffffff}
line[stroke="#444"]{stroke:#1a1a1a}
