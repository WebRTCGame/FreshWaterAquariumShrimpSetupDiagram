<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="sans-serif">
<title>P&amp;ID Symbol Library - Combined Legend</title>
<style>
  .cell { fill: #fff; stroke: #ccc; }
  .cap { font-size: 13px; fill: #333; text-anchor: middle; }
  .sec { font-size: 16px; font-weight: bold; fill: #111; }
</style>
<g id="legend">
  <text x="20" y="28" class="sec">ISA-5.1 Instruments</text>
  <g transform="translate(20,45)">
    <g transform="translate(40,50)"><circle cx="0" cy="0" r="25" fill="none" stroke="black" stroke-width="2"/><text x="0" y="4" text-anchor="middle" font-size="12">FT</text></g>
    <text x="40" y="95" class="cap">Field instrument</text>
    <g transform="translate(200,50)"><circle cx="0" cy="0" r="25" fill="none" stroke="black" stroke-width="2"/><rect x="-7" y="-7" width="14" height="14" fill="none" stroke="black" stroke-width="2"/></g>
    <text x="200" y="95" class="cap">Shared display (DCS)</text>
    <g transform="translate(340,50)"><path d="M0 -25 L21.6 -12.5 L21.6 12.5 L0 25 L-21.6 12.5 L-21.6 -12.5 Z" fill="none" stroke="black" stroke-width="2"/></g>
    <text x="340" y="95" class="cap">Computer function</text>
    <g transform="translate(480,50)"><rect x="-13" y="-13" width="26" height="26" fill="none" stroke="black" stroke-width="2"/><path d="M-10 7 L-10 -7 L6 0 Z"/></g>
    <text x="480" y="95" class="cap">PLC function</text>
    <g transform="translate(620,50)"><path d="M0 -25 L25 0 L0 25 L-25 0 Z" fill="none" stroke="black" stroke-width="2"/></g>
    <text x="620" y="95" class="cap">Primary element</text>
  </g>

  <text x="20" y="172" class="sec">ISA-5.1 Signals</text>
  <g transform="translate(20,188)">
    <g transform="translate(40,15)"><path d="M-35 0 H35" stroke="black" stroke-width="3"/></g>
    <text x="40" y="40" class="cap">Process line</text>
    <g transform="translate(160,10)"><path d="M-35 5 H35 M-35 15 H35" stroke="black" stroke-width="2"/></g>
    <text x="160" y="40" class="cap">Pneumatic</text>
    <g transform="translate(280,15)"><path d="M-35 0 H35" stroke="black" stroke-width="2" stroke-dasharray="8 5"/></g>
    <text x="280" y="40" class="cap">Electrical</text>
    <g transform="translate(400,15)"><path d="M-35 0 H35" stroke="black" stroke-width="2" stroke-dasharray="12 4 2 4"/></g>
    <text x="400" y="40" class="cap">Capillary</text>
    <g transform="translate(520,10)"><path d="M-35 5 H35 M-35 15 H35" stroke="black" stroke-width="2" stroke-dasharray="8 5"/></g>
    <text x="520" y="40" class="cap">Hydraulic</text>
  </g>

  <text x="20" y="270" class="sec">Valves</text>
  <g transform="translate(20,286)">
    <g transform="translate(50,25)"><path d="M-25 -15 L0 0 L-25 15 Z M25 -15 L0 0 L25 15 Z M0 -25 V25" fill="none" stroke="black" stroke-width="2"/></g>
    <text x="50" y="70" class="cap">Gate</text>
    <g transform="translate(150,25)"><circle cx="0" cy="0" r="16" fill="none" stroke="black" stroke-width="2"/><path d="M0 -25 V-9 M0 9 V25 M-25 0 H0"/></g>
    <text x="150" y="70" class="cap">Globe</text>
    <g transform="translate(250,25)"><circle cx="0" cy="0" r="14" fill="none" stroke="black" stroke-width="2"/><path d="M0 -25 V-11 M0 11 V25"/></g>
    <text x="250" y="70" class="cap">Ball</text>
    <g transform="translate(350,25)"><path d="M-25 0 A15 15 0 0 1 0 -15 A15 15 0 0 1 25 0 M-25 0 A15 15 0 0 0 0 15 A15 15 0 0 0 25 0 M0 -25 V25" fill="none" stroke="black" stroke-width="2"/></g>
    <text x="350" y="70" class="cap">Butterfly</text>
    <g transform="translate(450,25)"><path d="M-25 0 H25 M15 -10 L25 0 L15 10" fill="none" stroke="black" stroke-width="2"/><circle cx="-10" cy="0" r="8" fill="none" stroke="black" stroke-width="2"/></g>
    <text x="450" y="70" class="cap">Check</text>
    <g transform="translate(550,25)"><path d="M-25 -15 L0 0 L-25 15 Z M25 -15 L0 0 L25 15 Z" fill="none" stroke="black" stroke-width="2"/><path d="M-30 25 H30" stroke="black" stroke-width="2"/><path d="M0 -25 V-35" stroke="black" stroke-width="2"/><path d="M-16 -30 A12 12 0 0 1 16 -30" fill="none" stroke="black" stroke-width="2"/></g>
    <text x="550" y="70" class="cap">Control (diaphragm)</text>
    <g transform="translate(650,25)"><circle cx="0" cy="0" r="16" fill="none" stroke="black" stroke-width="2"/><path d="M0 -16 V-25 M-25 0 H-16 M0 16 V25"/><path d="M16 -9 L24 -17 M20 -3 L28 -11" stroke="black" stroke-width="2"/></g>
    <text x="650" y="70" class="cap">Relief (PSV)</text>
  </g>

  <text x="20" y="390" class="sec">Equipment</text>
  <g transform="translate(20,406)">
    <g transform="translate(50,25)"><circle cx="0" cy="0" r="25" fill="none" stroke="black" stroke-width="2"/><path d="M-10 -15 Q15 0 -10 15 Q0 0 -10 -15" fill="none" stroke="black" stroke-width="2"/><path d="M-45 0 H-25 M25 0 H45"/></g>
    <text x="50" y="75" class="cap">Centrifugal pump</text>
    <g transform="translate(160,25)"><rect x="-25" y="-20" width="50" height="40" fill="none" stroke="black" stroke-width="2" rx="3"/><path d="M-20 -10 L-20 10 L0 10 Z" fill="none" stroke="black" stroke-width="2"/></g>
    <text x="160" y="75" class="cap">Vessel</text>
    <g transform="translate(270,25)"><rect x="-25" y="-20" width="50" height="40" fill="none" stroke="black" stroke-width="2" rx="3"/><path d="M-15 10 L-15 15 M0 10 V15 M15 10 V15"/></g>
    <text x="270" y="75" class="cap">Tank (legs)</text>
    <g transform="translate(380,25)"><circle cx="0" cy="0" r="25" fill="none" stroke="black" stroke-width="2"/><circle cx="0" cy="0" r="10" fill="none" stroke="black" stroke-width="2"/><path d="M-45 0 H-25 M25 0 H45"/></g>
    <text x="380" y="75" class="cap">Compressor</text>
    <g transform="translate(490,25)"><rect x="-25" y="-15" width="50" height="30" fill="none" stroke="black" stroke-width="2"/><circle cx="-25" cy="0" r="15" fill="none" stroke="black" stroke-width="2"/><circle cx="25" cy="0" r="15" fill="none" stroke="black" stroke-width="2"/><path d="M-15 -15 V15 M-5 -15 V15 M5 -15 V15 M15 -15 V15"/></g>
    <text x="490" y="75" class="cap">Heat exchanger</text>
    <g transform="translate(600,25)"><path d="M0 -25 L25 0 L0 25 L-25 0 Z" fill="none" stroke="black" stroke-width="2"/><path d="M-10 -8 Q5 0 -10 8" fill="none" stroke="black" stroke-width="2"/></g>
    <text x="600" y="75" class="cap">Filter</text>
  </g>
</g>
</svg>