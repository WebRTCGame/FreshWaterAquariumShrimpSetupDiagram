
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Freshwater Aquarium Shrimp Setup</title>
    <meta name="description" content="Diagram and component reference for a freshwater shrimp aquarium setup." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/aquarium.css">
    <link rel="stylesheet" href="css/tooltip.css">
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.12.2/+esm';
      // Expose the preloaded mermaid module to other scripts
      window._externalMermaid = mermaid;
      console.log('Preloaded mermaid and set window._externalMermaid');
    </script>
  </head>
  </head>
  <body>
    <div id="sidebar">
      <div id="sidebar-header">
        Component Navigator
        <div style="font-size: 11px; font-weight: normal; margin-top: 6px; padding-top: 6px; border-top: 1px solid #495057; color: #e9ecef;">
          <div style="margin-bottom: 6px;">💡 <strong>Hover</strong> over diagram components for quick info</div>
          <div style="margin-bottom: 8px;">🖱️ <strong>Click</strong> diagram items to focus & zoom</div>
          <button onclick="testTooltips()" style="background: #007bff; color: white; border: none; padding: 4px 8px; border-radius: 3px; font-size: 10px; margin-top: 4px;">🔧 Debug Tooltips</button>
        </div>
        <div style="font-size: 12px; font-weight: normal; margin-top: 8px; padding-top: 8px; border-top: 1px solid #495057;">
          <div style="color: #28a745;">💡 Total System Operating Cost:</div>
          <div style="color: #ffc107; font-weight: bold;">Monthly: ~$21.84</div>
          <div style="color: #ffc107; font-weight: bold;">Yearly: ~$273.27</div>
          <div style="font-size: 10px; color: #adb5bd; margin-top: 4px;">Based on $0.14/kWh electricity rate</div>
        </div>
      </div>
      <div id="component-list">
        <!-- Components will be populated by JavaScript -->
      </div>
    </div>
    
    <div id="main-container">
      <button id="toggle-sidebar">☰ Toggle Sidebar</button>
      <div id="graphDiv"></div>
      <!-- Tooltip element -->
      <div id="component-tooltip" class="component-tooltip"></div>

      <!-- Bottom control panel for toggles -->
      <div id="bottom-panel" class="bottom-panel collapsed" aria-hidden="true">
        <div class="bottom-panel-header">
          <div class="panel-title">Controls & Toggles</div>
          <div class="panel-actions">
            <input id="bp-search" placeholder="Search components..." />
            <button id="bp-toggle" title="Open/Close">▲</button>
          </div>
        </div>
        <div class="bottom-panel-body">
          <div class="panel-controls">
            <button id="bp-show-all">Show All</button>
            <button id="bp-hide-all">Hide All</button>
            <button id="bp-rebuild">Rebuild Tooltips</button>
            <label style="margin-left:12px; font-size:12px;"><input type="checkbox" id="bp-hover-logging" /> Enable Hover Logging</label>
          </div>
          <div id="bp-list" class="panel-list" role="list"></div>
        </div>
      </div>
    </div>
    <script src="js/svg-pan-zoom.js"></script>
    <script src="js/data.js"></script>
    <script src="js/graph.js"></script>
    <script type="module" src="js/bootstrap.js"></script>



  </body>
</html>
