<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" version="1.1">
  <metadata>
    <symbol>
      <id>double_pipe_exchanger</id>
      <category>heat-exchanger</category>
      <description>Double pipe / hairpin exchanger</description>
      <standard>original-standards-inspired</standard>
      <version>1.0.0</version>
      <connections>
        <connection id="inner_in" x="10" y="40" type="pipe"/>
        <connection id="inner_out" x="90" y="40" type="pipe"/>
        <connection id="annulus_in" x="10" y="60" type="pipe"/>
